services:
  db:
    image: postgres:15-alpine
    container_name: duallibras-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-festival}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-festival}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - duallibras-network

  auth:
    build:
      context: ./server/auth
      dockerfile: Dockerfile
    container_name: duallibras-auth
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL:?Configure DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL:-}
      - JWT_SECRET=${JWT_SECRET:?Configure JWT_SECRET}
      - AI_INTERNAL_TOKEN=${AI_INTERNAL_TOKEN:?Configure AI_INTERNAL_TOKEN}
      - CORS_ORIGIN=${PUBLIC_ORIGIN:?Configure PUBLIC_ORIGIN com a origem HTTPS}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - AUTH_COOKIE_NAME=festival_session
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - TRUST_PROXY=1
      - AUTH_LOGIN_LIMIT=${AUTH_LOGIN_LIMIT:-20}
      - AUTH_SIGNUP_LIMIT=${AUTH_SIGNUP_LIMIT:-5}
      - CLASSROOM_JOIN_LIMIT=${CLASSROOM_JOIN_LIMIT:-20}
      - MATERIAL_MAX_BYTES=${MATERIAL_MAX_BYTES:-26214400}
      - AI_BACKEND_URL=http://backend:5455
      - MATERIAL_UPLOAD_DIR=/app/storage/materials/auth
    volumes:
      - auth-materials:/app/storage/materials/auth
    depends_on:
      db:
        condition: service_healthy
    networks:
      - duallibras-network

  backend:
    build:
      context: ./server/ai
      dockerfile: Dockerfile
    container_name: duallibras-backend
    environment:
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY:-}
      - AUTH_BACKEND_URL=http://auth:4000
      - AI_INTERNAL_TOKEN=${AI_INTERNAL_TOKEN:?Configure AI_INTERNAL_TOKEN}
      - CORS_ORIGIN=${PUBLIC_ORIGIN:?Configure PUBLIC_ORIGIN}
      - AI_REQUESTS_PER_MINUTE=${AI_REQUESTS_PER_MINUTE:-60}
      - AI_HTTP_MAX_BYTES=${AI_HTTP_MAX_BYTES:-37748736}
      - MATERIAL_MAX_BYTES=${MATERIAL_MAX_BYTES:-26214400}
      - AI_MAX_SESSIONS=${AI_MAX_SESSIONS:-4}
      - AI_MAX_SESSIONS_PER_USER=${AI_MAX_SESSIONS_PER_USER:-1}
      - AI_SESSION_MAX_SECONDS=${AI_SESSION_MAX_SECONDS:-3600}
      - AI_AUTH_RECHECK_SECONDS=${AI_AUTH_RECHECK_SECONDS:-5}
      - AI_WS_STARTS_PER_MINUTE=${AI_WS_STARTS_PER_MINUTE:-6}
      - AUDIO_SAMPLE_RATE=16000
      - AUDIO_CHANNELS=1
      - AUDIO_CHUNK_SIZE=1600
      - AUDIO_QUEUE_MAX_SIZE=8
      - USE_WEBRTC_VAD=1
      - VAD_MODE=2
      - VAD_ENERGY_THRESHOLD=300
      - VAD_HOLD_SILENCE_MS=240
      - SPEECH_MODEL=u3-rt-pro
      - LOCAL_FALLBACK_MODEL=${LOCAL_FALLBACK_MODEL:-medium}
      - LOCAL_WHISPER_DEVICE=${LOCAL_WHISPER_DEVICE:-cpu}
      - LOCAL_WHISPER_COMPUTE_TYPE=${LOCAL_WHISPER_COMPUTE_TYPE:-int8}
      - LOCAL_WHISPER_CPU_THREADS=${LOCAL_WHISPER_CPU_THREADS:-6}
      - LOCAL_WHISPER_BEAM_SIZE=${LOCAL_WHISPER_BEAM_SIZE:-2}
      - LOCAL_WHISPER_VAD_FILTER=1
      - LOCAL_WHISPER_VAD_MIN_SILENCE_MS=300
      - LOCAL_WHISPER_VAD_SPEECH_PAD_MS=200
      - LOCAL_WHISPER_NO_SPEECH_THRESHOLD=0.6
      - LOCAL_WHISPER_HOTWORDS=${LOCAL_WHISPER_HOTWORDS:-professor, professora, alunos, alunas, aula, escola, matéria, explicação, dúvida, exercício, prova, conteúdo, turma, questão, conceito, exemplo, teoria, matemática, português, história, geografia, biologia, física, química}
      - LOCAL_WHISPER_INITIAL_PROMPT=${LOCAL_WHISPER_INITIAL_PROMPT:-Transcrição em português do Brasil de uma aula presencial. Fala do professor e dos alunos sobre explicações pedagógicas, matérias escolares, termos didáticos e dúvidas em sala de aula.}
      - LOCAL_TRANSCRIPTION_CHUNK_SECONDS=${LOCAL_TRANSCRIPTION_CHUNK_SECONDS:-2.5}
      - LOCAL_TRANSCRIPTION_MIN_SECONDS=${LOCAL_TRANSCRIPTION_MIN_SECONDS:-1.2}
      - USE_PORTUGUESE_PROMPT=1
      - SAVE_TRANSCRIPTS=1
      - TRANSCRIPT_OUTPUT_DIR=/app/storage/transcripts/live
      - OUTPUT_PATH=/app/storage
      - MATERIAL_OUTPUT_DIR=/app/storage/materials/ai
      - DOCUMENTATION_OUTPUT_DIR=/app/storage/documentation
      - LOG_LEVEL=INFO
      - PORT=5455
    volumes:
      - ai-storage:/app/storage
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:5455/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - duallibras-network
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_HTTP_URL: /api/ai
        VITE_BACKEND_WS_URL: ''
        VITE_AUTH_BACKEND_HTTP_URL: /api/auth
    container_name: duallibras-frontend
    ports:
      - '${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - duallibras-network
    restart: unless-stopped

networks:
  duallibras-network:
    driver: bridge

volumes:
  auth-materials:
    driver: local
  ai-storage:
    driver: local
  db-data:
    driver: local
