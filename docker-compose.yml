version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: duallibras-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - duallibras-network

  auth:
    build:
      context: ./server/auth
      dockerfile: Dockerfile
    container_name: duallibras-auth
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - AI_BACKEND_URL=http://backend:5455
      - MATERIAL_UPLOAD_DIR=/app/uploads/materials
    volumes:
      - ./server/auth/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - duallibras-network

  backend:
    build:
      context: ./server/ai
      dockerfile: Dockerfile
    container_name: duallibras-backend
    ports:
      - "5455:5455"
    environment:
      - AUDIO_SAMPLE_RATE=16000
      - AUDIO_CHANNELS=1
      - AUDIO_CHUNK_SIZE=1600
      - AUDIO_QUEUE_MAX_SIZE=8
      - USE_WEBRTC_VAD=1
      - VAD_MODE=2
      - VAD_ENERGY_THRESHOLD=300
      - VAD_HOLD_SILENCE_MS=240
      - SPEECH_MODEL=u3-rt-pro
      - LOCAL_FALLBACK_MODEL=${LOCAL_FALLBACK_MODEL:-medium}
      - LOCAL_WHISPER_DEVICE=${LOCAL_WHISPER_DEVICE:-cpu}
      - LOCAL_WHISPER_COMPUTE_TYPE=${LOCAL_WHISPER_COMPUTE_TYPE:-int8}
      - LOCAL_WHISPER_CPU_THREADS=${LOCAL_WHISPER_CPU_THREADS:-6}
      - LOCAL_WHISPER_BEAM_SIZE=${LOCAL_WHISPER_BEAM_SIZE:-2}
      - LOCAL_WHISPER_VAD_FILTER=1
      - LOCAL_WHISPER_VAD_MIN_SILENCE_MS=300
      - LOCAL_WHISPER_VAD_SPEECH_PAD_MS=200
      - LOCAL_WHISPER_NO_SPEECH_THRESHOLD=0.6
      - LOCAL_WHISPER_HOTWORDS=${LOCAL_WHISPER_HOTWORDS:-professor, professora, alunos, alunas, aula, escola, matéria, explicação, dúvida, exercício, prova, conteúdo, turma, questão, conceito, exemplo, teoria, matemática, português, história, geografia, biologia, física, química}
      - LOCAL_WHISPER_INITIAL_PROMPT=${LOCAL_WHISPER_INITIAL_PROMPT:-Transcrição em português do Brasil de uma aula presencial. Fala do professor e dos alunos sobre explicações pedagógicas, matérias escolares, termos didáticos e dúvidas em sala de aula.}
      - LOCAL_TRANSCRIPTION_CHUNK_SECONDS=${LOCAL_TRANSCRIPTION_CHUNK_SECONDS:-2.5}
      - LOCAL_TRANSCRIPTION_MIN_SECONDS=${LOCAL_TRANSCRIPTION_MIN_SECONDS:-1.2}
      - USE_PORTUGUESE_PROMPT=1
      - SAVE_TRANSCRIPTS=1
      - TRANSCRIPT_OUTPUT_DIR=/app/transcripts
      - MATERIAL_OUTPUT_DIR=/app/materials
      - LOG_LEVEL=INFO
      - PORT=5455
    volumes:
      - ./server/ai/transcripts:/app/transcripts
      - ./server/ai/materials:/app/materials
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5455/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - duallibras-network
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: duallibras-frontend
    ports:
      - "80:80"
    environment:
      - VITE_BACKEND_HOST=backend
      - VITE_BACKEND_PORT=5455
      - VITE_BACKEND_WS_URL=ws://localhost:5455/ws
      - VITE_AUTH_URL=http://localhost:4000
    depends_on:
      backend:
        condition: service_healthy
      auth:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - duallibras-network
    restart: unless-stopped

networks:
  duallibras-network:
    driver: bridge

volumes:
  transcripts:
    driver: local
  db-data:
    driver: local
