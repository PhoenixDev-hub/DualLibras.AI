server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # Only Vite's content-hashed assets may be cached indefinitely.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Public worklets, WASM and models have stable URLs: revalidate on reuse.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm|onnx)$ {
        add_header Cache-Control "public, no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /health.html {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    client_max_body_size 36m;
    client_body_timeout 15s;

    # Only this public gateway is trusted by Express. Never expose /internal.
    location ^~ /api/auth/internal/ { return 404; }
    location ^~ /api/auth/ {
        proxy_pass http://auth:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /api/ai/ws {
        proxy_pass http://backend:5455/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 75s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }
    location = /api/ai/materials/ingest { return 404; }
    location ^~ /api/ai/ {
        proxy_pass http://backend:5455/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
